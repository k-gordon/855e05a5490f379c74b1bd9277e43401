name: Build Archform RustDesk Web

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FLUTTER_VERSION: "3.24.5"
  IMAGE_NAME: ghcr.io/k-gordon/855e05a5490f379c74b1bd9277e43401

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          npm install -g yarn typescript

      - name: Build RustDesk web bridge
        working-directory: flutter/web/js
        run: |
          yarn install --ignore-engines
          yarn build

      - name: Build Flutter web app
        working-directory: flutter
        run: |
          flutter pub get
          flutter build web --release --base-href /web/

      - name: Prepare image context
        run: |
          mkdir -p image/web
          cp -a flutter/build/web/. image/web/
          cat > image/default.conf <<'EOF'
          server {
              listen 80;
              server_name _;

              add_header Cross-Origin-Embedder-Policy require-corp always;
              add_header Cross-Origin-Opener-Policy same-origin always;
              add_header Cross-Origin-Resource-Policy same-origin always;
              add_header Content-Security-Policy "frame-ancestors 'self' https://fleet.archform.com http://localhost:5173 http://localhost:3000" always;

              location = / {
                  return 302 /web/;
              }

              location /web/ {
                  root /usr/share/nginx/html;
                  try_files $uri $uri/ /web/index.html;
              }
          }
          EOF
          cat > image/Dockerfile <<'EOF'
          FROM nginx:1.27-alpine
          COPY default.conf /etc/nginx/conf.d/default.conf
          COPY web/ /usr/share/nginx/html/web/
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
