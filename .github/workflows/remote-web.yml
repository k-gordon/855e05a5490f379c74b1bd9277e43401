name: Build Remote Web

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FLUTTER_VERSION: "3.24.5"
  IMAGE_NAME: ghcr.io/k-gordon/855e05a5490f379c74b1bd9277e43401

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          corepack enable
          corepack prepare yarn@3.2.4 --activate

      - name: Build web bridge
        working-directory: flutter/web/js
        run: |
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install
          yarn build
          mkdir -p ../ogvjs-1.8.6
          cp -a node_modules/ogv/dist/. ../ogvjs-1.8.6/
          cp node_modules/libopus.js/build/libopus.js ../libopus.js

      - name: Build Flutter web app
        working-directory: flutter
        run: |
          flutter pub get
          flutter build web --release --base-href /web/

      - name: Prepare image context
        run: |
          mkdir -p image/web
          cp -a flutter/build/web/. image/web/
          cat > image/default.conf <<'EOF'
          map $http_upgrade $connection_upgrade {
              default upgrade;
              '' close;
          }

          server {
              listen 80;
              server_name _;
              resolver 127.0.0.11 valid=10s ipv6=off;

              add_header Cross-Origin-Embedder-Policy require-corp always;
              add_header Cross-Origin-Opener-Policy same-origin always;
              add_header Cross-Origin-Resource-Policy same-origin always;
              add_header Content-Security-Policy "frame-ancestors 'self' https: http://localhost:5173 http://localhost:3000" always;

              location = / {
                  return 302 /web/;
              }

              location ~* ^/web/.+\.(js|mjs|wasm|json|png|svg|ico|css|map|txt)$ {
                  root /usr/share/nginx/html;
                  try_files $uri =404;
              }

              location /ws/hbbs {
                  set $hbbs_upstream rustdesk-hbbs:21118;
                  proxy_pass http://$hbbs_upstream/;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                  proxy_set_header Host $host;
                  proxy_read_timeout 3600s;
              }

              location /ws/hbbr {
                  set $hbbr_upstream rustdesk-hbbr:21119;
                  proxy_pass http://$hbbr_upstream/;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                  proxy_set_header Host $host;
                  proxy_read_timeout 3600s;
              }

              location /web/ {
                  root /usr/share/nginx/html;
                  try_files $uri $uri/ /web/index.html;
              }
          }
          EOF
          cat > image/Dockerfile <<'EOF'
          FROM nginx:1.27-alpine
          COPY default.conf /etc/nginx/conf.d/default.conf
          COPY web/ /usr/share/nginx/html/web/
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
