  <script>
    (function remoteWebEarlyConfig() {
      const sourceUrl = "https://github.com/k-gordon/855e05a5490f379c74b1bd9277e43401";
      const mappings = {
        host: ["custom-rendezvous-server", "wc-custom-rendezvous-server"],
        relay: ["relay-server", "wc-relay-server"],
        api: ["api-server", "wc-api-server"],
        key: ["key", "wc-key"],
      };

      window.__remoteWebAgplSourceUrl = sourceUrl;

      function parseConnectHash() {
        const raw = window.location.hash || "";
        let payload = "";
        if (raw.startsWith("#connect:/")) {
          payload = raw.slice("#connect:/".length);
        } else if (raw.startsWith("#connect/")) {
          payload = raw.slice("#connect/".length);
        } else {
          return null;
        }

        const queryIndex = payload.indexOf("?");
        const idPart = queryIndex >= 0 ? payload.slice(0, queryIndex) : payload;
        const queryPart = queryIndex >= 0 ? payload.slice(queryIndex + 1) : "";
        const id = decodeURIComponent(idPart || "").replace(/\/r$/, "");
        if (!id) return null;

        return { id, params: new URLSearchParams(queryPart), payload };
      }

      try {
        const params = new URLSearchParams(window.location.search);
        const pending = parseConnectHash();
        const hashParams = pending ? pending.params : new URLSearchParams();
        Object.entries(mappings).forEach(([param, keys]) => {
          const value = params.get(param) || hashParams.get(param);
          if (!value) return;
          keys.forEach((key) => localStorage.setItem(key, value));
        });

        if (pending && window.location.hash.startsWith("#connect:/")) {
          window.history.replaceState(
            null,
            "",
            window.location.pathname + window.location.search + "#connect/" + pending.payload
          );
        }
      } catch (error) {
        console.warn("Remote Web config bootstrap failed", error);
      }
    })();
  </script>

      border-bottom: 16px solid #024eff;

      width: 120px;
      height: 120px;
      -webkit-animation: spin 2s linear infinite;

    body.remote-web-ready .loading {
      display: none;
    }

    @-webkit-keyframes spin {
      0% {
        -webkit-transform: rotate(0deg);
      }

      100% {
        -webkit-transform: rotate(360deg);
      }
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);

  <script>
    (function remoteWebBootstrap() {
      function hideLoadingIndicator() {
        document.body.classList.add("remote-web-ready");
        const loading = document.querySelector(".loading");
        if (loading) loading.remove();
      }

      window.addEventListener("flutter-first-frame", hideLoadingIndicator, { once: true });
    })();
  </script>

  <script>
    var serviceWorkerVersion = null;
    var scriptLoaded = false;
    function loadMainDartJs() {
      if (scriptLoaded) {
        return;
      }
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }

    if ('serviceWorker' in navigator) {
      // Service workers are supported. Use them.
      window.addEventListener('load', function () {
        // Wait for registration to finish before dropping the <script> tag.
        // Otherwise, the browser will load the script multiple times,
        // potentially different versions.
        var serviceWorkerUrl = 'flutter_service_worker.js?v=' + serviceWorkerVersion;
        navigator.serviceWorker.register(serviceWorkerUrl)
          .then((reg) => {
            function waitForActivation(serviceWorker) {
              serviceWorker.addEventListener('statechange', () => {
                if (serviceWorker.state == 'activated') {
                  console.log('Installed new service worker.');
                  loadMainDartJs();
                }
              });
            }
            if (!reg.active && (reg.installing || reg.waiting)) {
              // No active web worker and we have installed or are installing
              // one for the first time. Simply wait for it to activate.
              waitForActivation(reg.installing || reg.waiting);
            } else if (!reg.active.scriptURL.endsWith(serviceWorkerVersion)) {
              // When the app updates the serviceWorkerVersion changes, so we
              // need to ask the service worker to update.
              console.log('New service worker available.');
              reg.update();
              waitForActivation(reg.installing);
            } else {
              // Existing service worker is still good.
              console.log('Loading app from service worker.');
              loadMainDartJs();
            }
          });

        // If service worker doesn't succeed in a reasonable amount of time,
        // fallback to plaint <script> tag.
        setTimeout(() => {
          if (!scriptLoaded) {
            console.warn(
              'Failed to load app from service worker. Falling back to plain <script> tag.',
            );
            loadMainDartJs();
          }
        }, 4000);
      });
    } else {
      // Service workers not supported. Just drop the <script> tag.
      loadMainDartJs();
    }
  </script>
